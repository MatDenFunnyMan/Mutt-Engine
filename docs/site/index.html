<script id="docs" type="application/json">{"version": "1.3", "pages": [{"file": "01-getting-started.md", "slug": "getting-started", "title": "Getting Started", "markdown": "# Getting Started\n\n#### Welcome to Mutt Engine's \"Instruction Booklet\", official (ig?) documentation for my very own Psych fork.\n\n## Where do MODS go?\n\nPut them in `mods/`, like in the example.\n\n```\nMuttEngine.exe\nmods/\n  my-mod/\n  another-mod/\n```\n\nName of the folder is recognized as the mod's \"ID\", used by the `currentModDirectory` variable. Make sure to name them right (and not call it superduperamazingshitassmodtm or smth)\n\nMutt Engine ships with two template mod folders to use:\n\n| Template | Description |\n|---|---|\n| `mods/your-mod` | A **NEW** and **MODERNIZED** mod folder similar to new engines like Codename or V-Slice, more organized. |\n| `mods/your-mod-legacy` | The **OG Psych Engine** mod folder, backwards compatibility with Mutt, allowing base Psych mods to work. |\n\n## NEW MOD FOLDER STRUCTURE (Expanded View)\n\n```\nyour-mod/\n  pack.json             mod name, description, color...\n  pack.png              mod icon in the Mods menu\n  content/\n    images/             every image (characters, stages, menus...)\n    audio/\n      music/            menu and cutscene music\n      sounds/           sound effects\n    shaders/            .frag shaders\n    translations/       translated text and images\n    custom_weeks/       assets used by one week only\n  data/\n    characters/         character .json files\n    stages/             stage .json files (+ .lua / .hx stage scripts)\n    weeks/              week .json files\n    songs/\n      my-song/\n        charts/         my-song-easy.json, my-song.json, my-song-hard.json...\n        song/           Inst.ogg, Voices.ogg\n        scripts/        scripts that run only in this song\n        events.json     chart events (optional)\n  scripts/              scripts that run in every song\n  states/               custom menus and screens (see Scripting)\n  custom_events/        your own chart events\n  custom_notetypes/     your own note types\n  fonts/\n  videos/\n```\n\n***NOTE: Not all folders are needed for the mod to work.***\n\n### PATH SHORTCUTS\n\nScripts and JSON files allow for quick **\"shortcut\" paths**, like Psych Engine does. Here's how it works for Mutt:\n\n| \"Shortcut\" Path | Full Path |\n|---|---|\n| `images/...` | `content/images/...` |\n| `sounds/...` | `content/audio/sounds/...` |\n| `music/...` | `content/audio/music/...` |\n| `shaders/...` | `content/shaders/...` |\n| `characters/...` | `data/characters/...` |\n| `stages/...` | `data/stages/...` |\n| `weeks/...` | `data/weeks/...` |\n\nEx. =  `createSprite('bg', 'stages/park/sky')` loads `content/images/stages/park/sky.png`.\n\nChanges were made to **image folders** as well, but old directories are <u>backwards compatible<\/u>:\n\n| Old (Psych) | New (Mutt) [`content/images/`] |\n|---|---|\n| `icons/` | `characters/icons/` |\n| `dialogue/` | `extra/dialogue/` |\n| `achievements/` | `extra/achievements/` |\n| `soundtray/` | `extra/soundtray/` |\n| `menubackgrounds/` | `storymode/weekbg/` |\n| `menucharacters/` | `storymode/weekcharacters/` |\n| `menudifficulties/` | `storymode/weekdiff/` |\n| `storymenu/` | `storymode/weekname/` |\n| `noteSkins/` | `notes/` |\n| `noteSplashes/` | `notes/splashes/` |\n\n## pack.json\n\n`pack.json` describes the mod. All fields are optional.\n\n```json\n{\n\t\"name\": \"My Mod\",\n\t\"description\": \"A short description.\",\n\t\"color\": [255, 120, 0]\n}\n```\n\n| Field | Description |\n|---|---|\n| `name` | Name shown in the Mods menu. |\n| `description` | Text shown under the name in the Mods menu. |\n| `color` | Background color of the Mods menu, `[red, green, blue]`. |\n| `iconFramerate` | Speed of `pack.png` when it is animated. |\n| `restart` | `true` = the game restarts when the mod is turned on or off. |\n| `runsGlobally` | `true` = the mod's scripts also run while other mods are active. |\n| `changeTitle` | `false` = keep the engine's window title. `true` (default) = use `windowTitle`, or `name` if it's missing. |\n| `windowTitle` | Title of the game window while the mod is active. |\n| `discordRPC` | Discord application ID, to show your own name and images in Discord. |\n\n## CHOOSING MODS\n\nPress **TAB** in the Main Menu to open the mod selector. You'll find these options:\n\n| Mode | Description |\n|---|---|\n| **\"YOUR MOD NAME\"** | Allows ONE of your mods to run **WITHOUT** base game content. Remember, more mods can appear in the list but only the selected one is active. |\n| **ALL MODS** | All mods loaded run at the same time, **WITHOUT** base game content. |\n| **MODS + FNF SONGS** | All mods + base game content (Funkin 0.8.6) |\n| **DISABLE MODS** | Only base game content (Funkin 0.8.6) |\n\nCustom states (AKA custom menus, see [Scripting](09-scripting.md)) only work for **each SINGULAR mod**. It is recommended, if you have more than one mod with custom states, to DISABLE mods you're not playing and run one at a time to avoid conflicts.\nIf more than one mod is loaded, it will default to base game menus to avoid crashes.\n"}, {"file": "02-charts-and-songs.md", "slug": "charts-and-songs", "title": "Charts & Songs", "markdown": "# Charts & Songs\n\nThis page covers everything about songs: where the files go, the Chart Editor, events, extra characters and song subtitles.\n\n## The song folder\n\nEvery song has its own folder in `data/songs/`. The folder name is the song name in lowercase, with `-` instead of spaces.\n\n```\ndata/songs/my-song/\n  charts/\n    my-song-easy.json\n    my-song.json          Normal difficulty\n    my-song-hard.json\n  song/\n    Inst.ogg\n    Voices.ogg            or Voices-Player.ogg + Voices-Opponent.ogg\n  scripts/                Lua / HScript files that run only in this song\n  events.json             chart events (optional)\n  subtitles/              song-lyrics.json and other subtitles (optional)\n  healthbar.json          health bar for this song (see HUD)\n  dialogue.json           dialogue before the song (see Dialogues)\n  modchart.json           modchart (see Modcharts)\n```\n\nOld Psych charts (`data/my-song/my-song.json`) and **Codename Engine** charts (with their `meta.json`) are read by themselves: you don't need to convert them.\n\n## The Chart Editor\n\nOpen it from the Editor Menu (key **6** in the main menu). With Developer Mode on, key **7** during a song opens it at the current time.\n\n### Starting a chart\n\nThe first window lets you:\n\n- open one of the **recent charts**, or **Browse** for a chart file;\n- **Create From Song**: pick a song folder, then a difficulty;\n- **New Chart**: write the song name, BPM and scroll speed;\n- **From Codename**: import a Codename Engine chart.\n\nWhen you make a new chart, the editor asks for the audio files (`Inst`, `Voices`, or separate `Voices-Player` / `Voices-Opponent`) and copies them into the song folder for you.\n\n### The screen\n\n| Part | What's inside |\n|---|---|\n| **File** menu | New, Open Chart, Open Autosave, Open Events, **Import V-Slice**, **Import Codename**, Save, Save As, Save Events, Reload Chart. |\n| **Audio** menu | Mute instrumental or vocals, hitsounds for player and opponent, metronome. |\n| **Edit** menu | Undo, Redo, Copy, Paste, Cut, Select All, Delete, autosave settings, Clear All Notes / Events. |\n| **View** menu | Vortex Editor, waveform, Go to, theme, last/next section preview, note type labels, Toys, Reset UI Boxes. |\n| **Test** menu | Playtest, Playtest Here, Preview Chart. |\n| **Song** tab | Song name, BPM, scroll speed, audio offset, characters, stage, **Extra Characters**. |\n| **Chart** tab | **Difficulty** (switch difficulty without leaving), playback rate. |\n| **Meta** tab | Song credits: artist, composer, charter, coder. |\n| **Data** tab | Game Over character, sounds and music, **Note Pack**. |\n| **Section**, **Note**, **Events** tabs | The selected section, note or event. |\n\n**Toys** (View menu) are small characters at the side of the grid that sing the notes while you listen to the chart.\n\n### Shortcuts\n\nPress **F1** in the editor for the full list. The most used:\n\n| Key | Action |\n|---|---|\n| W / S, mouse wheel | Move in the song (Shift = faster, Alt = slower) |\n| A / D | Previous / next section |\n| Space | Play / pause |\n| Z / X | Zoom out / in |\n| Left / Right | Change snap |\n| Left click | Place a note (drag right after to make it a hold note) |\n| Right click | Delete a note |\n| Right click + drag | Selection box |\n| Shift + drag | Duplicate the selected notes |\n| Q / E | Shorter / longer hold note |\n| Ctrl + Z / Ctrl + Shift + Z | Undo / Redo |\n| Ctrl + C / X / V | Copy / Cut / Paste |\n| Ctrl + S | Save |\n| Enter | Playtest (Shift + Enter = from here, Ctrl + Enter = preview) |\n\n## Note types\n\nBuilt-in note types:\n\n| Note type | What it does |\n|---|---|\n| Alt Animation | The character sings with the `-alt` animations. |\n| Hey! | The character plays its \"hey\" animation. |\n| Hurt Note | Hitting it hurts. Let it pass. |\n| GF Sing | Girlfriend sings it. |\n| No Animation | No sing animation. |\n| Censor | The character sings with its `-censor` animations. |\n\nTo make your own note types with their own look and rules, see [Notes](05-notes.md).\n\n## Events\n\nEvents are saved in the chart or in `events.json`. These are the built-in ones:\n\n| Event | What it does |\n|---|---|\n| Add Cam Zoom | A quick zoom bump on the game and HUD cameras. |\n| Cam Zoom | Changes the camera zoom, with duration and ease. |\n| Cam Bopping | How many camera bumps per beat, and how strong. |\n| Cam Follow Pos | Moves the camera to a character (BF, Dad, GF, 3, 4...), to a position, or to a character plus an offset. |\n| Center Camera | Moves the camera to the center of the stage. |\n| Cam Speed | How fast the camera follows. |\n| Cam Flash | Flashes a camera with a color. |\n| Cam Shake | Shakes a camera. |\n| Cam Rotation | Rotates a camera. |\n| Change Character | Replaces a character. |\n| Set Char Idle Alt | Uses another idle animation (like `-alt`). |\n| Play Animation | Plays an animation on a character, optionally looping. |\n| Character Sing-Along | Makes characters copy another one's animations (duets). |\n| Set GF Speed | How often Girlfriend bops. |\n| Change Notes | Changes the skin of notes, strums, splashes and hold covers (also with Note Packs). |\n| Set Note Speed | Changes the scroll speed, for one side or both. |\n| Play Video | Plays a video during the song. |\n| Health Drain | The player loses health while the opponent sings (or all the time, with *Persistent*). |\n| Ghost Trail | Leaves ghost copies behind a character. |\n| Silhouette | Turns characters into colored shapes, with a colored background. |\n| BG Flash | Flashes the background and characters with a color. |\n\nThe *Events* tab of the Chart Editor explains what each value does.\n\n### Your own events\n\nPut a script with the event's name in `custom_events/`. It runs when the event is triggered:\n\n```lua\n-- custom_events/Flash Red.lua\nfunction onEvent(name, value1, value2, strumTime)\n\tif name == 'Flash Red' then\n\t\tcameraFlash('game', 'FF0000', tonumber(value1) or 0.5)\n\tend\nend\n```\n\nOptionally add:\n\n- `Flash Red.txt`: the description shown in the Chart Editor.\n- `Flash Red.json`: the fields shown in the Chart Editor, instead of plain text boxes.\n\n```json\n[\n\t{\"label\": \"Duration\", \"type\": \"stepper\", \"min\": 0, \"max\": 5, \"step\": 0.1, \"decimals\": 1},\n\t{\"label\": \"Camera\", \"type\": \"dropdown\", \"options\": [\"game\", \"hud\"]},\n\t{\"label\": \"Fade Out\", \"type\": \"checkbox\"}\n]\n```\n\nField types: `inputtext` (default), `stepper`, `slider`, `dropdown`, `checkbox`. The values arrive in `onEvent` in the same order: `value1`, `value2`, then the next ones as extra arguments.\n\n## Extra characters\n\nA song can have up to **10 characters**: BF, Dad and 8 more (Girlfriend doesn't count).\n\n1. In the **Stage Editor**, *Extras* tab, add the spots for the extra characters (Character 3, 4...). See [Stages](04-stages.md).\n2. In the **Chart Editor**, *Song* tab, press **Extra Characters** and pick a character for each slot.\n3. Choose how it sings:\n   - **Shared strumline**: it uses the notes of BF, Dad or GF. Each extra character gets its own note types (`Character 3 Note`, `Character 3 ALT Note`...): place those notes and only that character sings them.\n   - **Own strumline**: it gets its own arrows, played by the player or by the opponent.\n\nIn events and scripts, extra characters are called by their number (`3`, `4`...) or as `character3`, `character4`...\n\nThe **Character Sing-Along** event makes duets easy: one character \"leads\" and the others copy its animations, misses included. Leave the followers empty and *All* off to stop it.\n\n## Song subtitles\n\nPut `subtitles/song-lyrics.json` in the song folder and the lyrics show up by themselves while the song plays (when the Subtitles option is on).\n\n```json\n{\n\t\"subtitles\": [\n\t\t{\"text\": \"Beep bop!\", \"start\": 1.5, \"end\": 3},\n\t\t{\"text\": \"Skee-dah bop!\", \"start\": \"0:04.2\", \"end\": \"0:06\"}\n\t]\n}\n```\n\nTimes are in seconds, or `minutes:seconds`. Each line can also have its own `font`, `size`, `color`, `x`, `y`, `scale`, `background`, `backgroundColor`, `outline` and `outlineColor`. `.srt` files work too.\n\nScripts can show other subtitles with `playSubtitles('name')`, which looks in the song's `subtitles/` folder first.\n"}, {"file": "03-characters.md", "slug": "characters", "title": "Characters", "markdown": "# Characters\n\nA character is a `.json` file in `data/characters/` plus its spritesheet in `content/images/characters/`. The easiest way to make one is the **Character Editor**.\n\n## The Character Editor\n\nOpen it from the Editor Menu, or with key **8** during a song (Developer Mode on). Press **F1** inside the editor for every shortcut.\n\n| Part | What's inside |\n|---|---|\n| **File** menu | Save Character, Reload Character, Load Template. |\n| **View** menu | **Switch View**: the normal *Character* view, or the *Spritesheet* view that shows the whole image with the frames of the selected animation. |\n| **Icon** menu | **Properties** and **Animations** of the health icon (see below). |\n| **Animations** tab | Add, change and remove animations. |\n| **Character** tab | Image, scale, health icon, health bar color, camera position, flip, antialiasing, **VSlice Sustains**. |\n| **Ghost** tab | Ghosts: see-through copies of other animations, to line up the offsets. |\n\n### Ghosts\n\nPress **F** to leave a ghost of the selected animation on screen. You can keep **as many ghosts as you want**, with different animations, and remove one by clicking it in the ghost list. Ghosts stay when you change the image or the character, marked as `(old)`, so you can line up a new spritesheet with the old one.\n\n### Shortcuts\n\n| Key | Action |\n|---|---|\n| W / S | Previous / next animation |\n| Space | Replay the animation |\n| Arrow keys, right click + drag | Move the offset (Shift = 10x) |\n| A / D | Previous / next frame |\n| Ctrl + C / Ctrl + V | Copy / paste the offset |\n| Ctrl + R | Reset the offset |\n| F | Ghost of the selected animation |\n| F12 | Show / hide silhouettes |\n| Ctrl + S | Save |\n\n## The character file\n\nThese are the fields you may want to change by hand. The editor writes all the others.\n\n| Field | What it does |\n|---|---|\n| `image` | Spritesheet in `images/`. More images separated by commas are joined together. |\n| `healthicon` | Name of the icon in `images/icons/`. |\n| `healthicon_antialiasing` | `false` for pixel icons. Small icons and icons ending in `-pixel` are already sharp. |\n| `healthbar_colors` | Health bar color, `[red, green, blue]`. |\n| `censored_character` | Character used when the Naughtyness option is off. |\n| `pause_music` | Pause menu music while this character is the player. |\n| `vocals_file` | Vocals of this character (`Voices-<name>.ogg`). |\n| `vslice_sustains` | See below. |\n\n## Hold notes like the base game\n\nTurn on **VSlice Sustains** (or `\"vslice_sustains\": true`) and the character keeps its pose during hold notes, instead of restarting the animation every few frames. The V-Slice input system always does this.\n\nIf the character has an animation with the same name plus `-hold`, like `singLEFT-hold`, that one plays while the note is held. When you let go, the normal animation finishes from where the hold one stopped.\n\n```json\n{\"anim\": \"singLEFT-hold\", \"name\": \"BF NOTE LEFT HOLD\", \"fps\": 24, \"loop\": true, \"indices\": [], \"offsets\": [5, -6]}\n```\n\n## Health icons\n\nIcons go in `content/images/characters/icons/` (or the old `images/icons/`), named `icon-<name>.png` or `<name>.png`.\n\n### Icon states\n\nA normal icon is a row of 150x150 squares, one for each state:\n\n| Square | State | When |\n|---|---|---|\n| 1 | Neutral | Always, when the others are missing. |\n| 2 | Losing | Health below 20%. |\n| 3 | Winning | Health above 80%. |\n| 4 | Winning more | Health above 90%. |\n\nSo an icon 300 pixels wide has neutral and losing, 600 pixels wide has all four.\n\n### Animated icons\n\nPut an `.xml` next to the icon and it becomes animated. Name the animations in the spritesheet with these prefixes and Mutt Engine finds them by itself:\n\n| State | Prefixes |\n|---|---|\n| Neutral | `neutral`, `normal`, `idle`, `icon`, `default` |\n| Losing | `lose`, `losing`, `loss` |\n| Winning | `win`, `winning` |\n| Winning more | `winextra`, `superwin`, `perfect` |\n\nTo choose the animations yourself, use **Icon > Animations** in the Character Editor: it saves an `.json` next to the icon.\n\n```json\n{\n\t\"animations\": [\n\t\t{\"state\": \"neutral\", \"prefix\": \"bf idle\", \"fps\": 24, \"loop\": true},\n\t\t{\"state\": \"losing\", \"prefix\": \"bf hurt\", \"fps\": 24, \"loop\": true, \"offsets\": [0, 4]}\n\t]\n}\n```\n\n## Ghost Trails\n\nGhost trails are copies of a character that fade behind it while it sings. Use the **Ghost Trail** event in the chart, or `setGhostTrail` in a script:\n\n```lua\nfunction onCreate()\n\tsetGhostTrail('dad', 'animated', {color = 'health', distance = 15})\nend\n```\n\n| Type | Look |\n|---|---|\n| `simple` | A still copy of the last pose. |\n| `animated` | A copy that moves away in the direction of the note. |\n| `aura` | Copies appear all the time, even when the character doesn't sing, glowing in the health bar color. |\n| `off` | No trail. |\n\nOptions: `doubleNote` (only on two or more notes at once), `color` (a color, or `health` for the health bar color), `alpha`, `duration`, `distance`, `grow`, `rate`, `blend`.\n"}, {"file": "04-stages.md", "slug": "stages", "title": "Stages", "markdown": "# Stages\n\nA stage is a `.json` file in `data/stages/`, with its images in `content/images/stages/`. You can also add a Lua or HScript file with the same name next to it, for anything the JSON can't do. The **Stage Editor** builds the JSON for you.\n\nAll the base game stages are JSON files too, so you can open them in the editor and learn from them.\n\n## The Stage Editor\n\nOpen it from the Editor Menu. Press **F1** inside the editor for every shortcut.\n\n| Part | What's inside |\n|---|---|\n| **Sprite List** | Every object of the stage, from back to front. The characters are in the list too: move them up or down to put objects in front of them. |\n| **Stage** box | Pick the stage to edit, reload it, or load a template. |\n| **Data** tab | Camera zoom and speed, positions of BF, GF and the opponent, camera offsets, hide a character, **Pixel Stage**, UI style. |\n| **Object** tab | The selected object: name, image, position, scale, scroll factor, angle, color, opacity, blend mode, flip, antialiasing, and in which quality it shows up (low, high or both). |\n| **Meta** tab | Which characters to preview in the editor, and the **Preload List** (files loaded before the song starts). |\n| **Extras** tab | Spots for the extra characters (Character 3 to 10). |\n\nPress **Enter** to add an object. It can be:\n\n- **No Animation**: a normal image.\n- **Animated**: a spritesheet with animations (Enter again with the object selected opens its animations).\n- **Square**: a plain colored rectangle, no image needed.\n\n### Shortcuts\n\n| Key | Action |\n|---|---|\n| Arrow keys, right click + drag | Move the selected object (Shift = faster, Ctrl = one pixel at a time) |\n| E / Q | Zoom in / out |\n| J / K / L / I | Move the camera |\n| R | Reset the zoom |\n| Delete | Remove the selected object |\n| Ctrl + C / X / V | Copy / Cut / Paste |\n| Ctrl + Z / Ctrl + Shift + Z | Undo / Redo |\n| Ctrl + S | Save |\n| F12 | Show / hide the selection rectangle |\n\n## Pixel stages\n\nCheck **Pixel Stage** in the *Data* tab for stages made of pixel art, like the week 6 school. The countdown, ratings and notes switch to their pixel versions.\n\n## Extra characters\n\nThe *Extras* tab adds spots for extra characters, from **Character 3** up to **Character 10**. For each one you set:\n\n- the **position** (drag it, like the other characters);\n- the **camera offset**, or **Camera Follows** to make the camera use BF's, GF's or the opponent's spot;\n- a character to **preview** it in the editor (only for the editor: the real character is picked in the chart).\n\nNew spots appear in the *Sprite List* as `character3`, `character4`..., so you can put them behind or in front of any object. **Remove Last** only removes the last spot, so the numbers in your charts never change.\n\nThen give each spot a character in the Chart Editor: see [Extra characters](02-charts-and-songs.md#extra-characters).\n\n## Stage scripts\n\nA script with the same name as the stage (`data/stages/park.lua`) runs in every song that uses that stage. Objects made in the editor can be used by their **name**:\n\n```lua\nfunction onBeatHit()\n\tif curBeat % 4 == 0 then\n\t\tplayAnim('crowd', 'cheer', true)\n\tend\nend\n```\n\n### Moving backgrounds\n\nTwo functions are made for stages:\n\n```lua\nfunction onCreate()\n\tcreateBackdrop('clouds', 'stages/park/clouds', 0, -200, {axes = 'x', velocityX = 30, scrollX = 0.3})\n\tcreateParticles('leaves', 'stages/park/leaf', 0, -100, {amount = 40, speed = {50, 120}, spin = {-90, 90}})\nend\n```\n\n- `createBackdrop` repeats an image forever (sky, clouds, a road) and can scroll it by itself.\n- `createParticles` shoots many small copies of an image, or colored squares when there is no image (snow, leaves, sparks).\n\nEvery option of both functions is on the [Lua API page](15-lua-api.md).\n"}, {"file": "05-notes.md", "slug": "notes", "title": "Notes", "markdown": "# Notes\n\nMutt Engine has one editor for everything about notes: the **Note Editor**. With it you make **Note Packs** (a full note skin) and **note types** (notes with their own look and rules).\n\n## Note Packs\n\nA Note Pack is one `.json` file in `data/notes/` with the look of:\n\n- the **strums** (the arrows at the top),\n- the **notes**,\n- the **splashes** (the effect when you hit Sick),\n- the **hold covers** (the effect while you hold a note).\n\nEach part can be different for the player and the opponent, and can have a **pixel** version for pixel stages. A pack can also give the strums a starting **tint** (a color over the arrows).\n\nTo use a pack in a song, pick it in the Chart Editor, *Data* tab, **Note Pack**. To change it in the middle of a song, write its name in the **Change Notes** event.\n\n## The Note Editor\n\nOpen it from the Editor Menu. Press **F1** inside the editor for the controls.\n\n| Part | What's inside |\n|---|---|\n| **File** menu | Save, Load from JSON, Load Template, New Notetype, Load Notetype. |\n| **Shader** menu | **Strumline Shader** (the tint of the arrows), **Notes RGB**, **Splashes RGB**, **Hold RGB** (colors of each part). |\n| **Strumline**, **Notes**, **Splashes**, **Hold Notes** tabs | Image, scale, antialiasing, **Pixel?** (edit the pixel version), RGB, and the animations of that part. |\n| **Gameplay** tab | Only for note types: the rules of the note. |\n\nThe preview on the left is a real strumline: press **your note keys** to try the animations, click an arrow to select it.\n\n| Key | Action |\n|---|---|\n| Your note keys | Press the arrows like in a song |\n| Arrow keys | Move the offset of the selected animation |\n| Ctrl + arrow keys | Move the base offset of the whole part |\n| Q / E | Previous / next frame |\n| G | Show / hide the default strumline, to compare positions |\n| Ctrl + S | Save |\n\nFields you don't touch keep the default values, so a pack can change only what it needs (for example, only the splashes).\n\n## Note types\n\nA note type is a note with its own look and its own rules, like the hurt notes or the static notes of Sonic.EXE mods. It's made of two files with the same name in `custom_notetypes/`:\n\n- `Static Note.json`: the look and the rules, made in the Note Editor (*File > New Notetype*).\n- `Static Note.lua` (or `.hx`): anything else, written by you. The *Gameplay* tab has buttons that create it already filled in.\n\nFor a note type that exists in one song only, put the files in `data/songs/<song>/custom_notetypes/`.\n\n### The Gameplay tab\n\n| Rule | What it does |\n|---|---|\n| Hit Causes Miss | Hitting the note counts as a miss. |\n| Can Skip (No Miss) | The player can let it pass without a miss. |\n| Opponent Ignores Note | The opponent doesn't hit it. |\n| No Animation / No Miss Anim | The character doesn't sing / doesn't play the miss animation. |\n| No Splash | No splash on Sick. |\n| Low Priority | When two notes overlap, this one is hit last. |\n| Health Gain / Health Loss | Health on hit and on miss (normal: 0.02 and 0.1). |\n| Hitsound | Sound when you hit it, from `sounds/`. |\n| Animation Suffix | Added to the sing animation, like `-alt`. |\n\n### The script\n\nThe script runs only when the song has notes of that type. Check the note type, because the functions run for every note:\n\n```lua\nfunction noteMiss(id, direction, noteType, isSustainNote)\n\tif noteType == 'Static Note' then\n\t\tplaySound('static', 0.6)\n\t\tcameraShake('game', 0.01, 0.2)\n\tend\nend\n```\n\nOld Psych note types (a `.lua` with an optional `.txt` description) still work.\n\n## Tinting the strums\n\nThe strums can be tinted with a color, from the Note Pack or from a script:\n\n```lua\nfunction onBeatHit()\n\tif curBeat == 64 then\n\t\ttweenStrumTint('redArrows', 'opponent', 'FF0000', 1, 'sineOut', 0.6)\n\tend\nend\n```\n\n| Function | What it does |\n|---|---|\n| `setStrumTint(target, color, ?strength)` | Tints the arrows right away. |\n| `tweenStrumTint(tag, target, color, duration, ?ease, ?strength)` | Fades to a tint. |\n| `resetStrumTint(target, ?duration, ?ease)` | Back to the tint of the Note Pack (or none). |\n\n`target` is `player`, `opponent`, `all`, `char3` (strumline of Character 3) or a lane number. `strength` goes from 0 (no tint) to 1 (full color).\n"}, {"file": "06-hud.md", "slug": "hud", "title": "HUD", "markdown": "# HUD\n\nThis page covers the custom health bar, the icons and the results screen.\n\n## Custom health bar\n\nThe health bar has two images, both optional:\n\n- **bg**: the frame, drawn on top.\n- **bar**: the colored part. It can have any shape (white works best), and it's tinted with the health colors, so `setHealthBarColors` keeps working.\n\nBoth are scaled to the size of the normal health bar and centered by themselves.\n\n### healthbar.json\n\nWrite a `healthbar.json` and Mutt Engine loads it by itself. The first one found is used:\n\n1. `data/songs/<song>/healthbar.json`: only that song.\n2. `data/healthbar.json`: every song of the mod.\n\n```json\n{\n\t\"bg\": \"healthbar/my-mod/frame\",\n\t\"bar\": \"healthbar/my-mod/fill\",\n\t\"scale\": 1.1\n}\n```\n\nThe paths are inside `images/`. Every other field is optional:\n\n| Field | What it does |\n|---|---|\n| `bg`, `bar` | The two images. Empty or missing = the normal ones. |\n| `scale` | Size of the whole health bar. |\n| `offset` | Moves the whole health bar, `[x, y]`. |\n| `barScale` | Size of the colored part only, `[x, y]` or one number. |\n| `barOffset` | Moves the colored part only, `[x, y]`. |\n| `iconScale` | Size of the icons. |\n| `iconOffset` | Moves the icons, `[x, y]`. A bigger `x` moves them further apart. |\n| `iconBop` | `false` = the icons don't bop on the beat. |\n| `bgAnimation`, `barAnimation` | `{\"prefix\": \"...\", \"fps\": 24}` for animated images (with an `.xml` next to them). |\n\nThe old way, `bar.png` and `bg.png` in `content/images/healthbar/`, still works.\n\n### From scripts\n\n```lua\nfunction onSectionHit()\n\tif curSection == 32 then\n\t\tloadHealthBar('healthbars/angry')\n\tend\nend\n```\n\n| Function | What it does |\n|---|---|\n| `loadHealthBar(?path)` | Loads a style from a `.json` in `data/` (`'healthbars/angry'` = `data/healthbars/angry.json`). Empty = back to the song's or mod's style. |\n| `setHealthBarBG(?image, ?prefix, ?fps)` | Changes only the frame. |\n| `setHealthBarSprite(?image, ?prefix, ?fps)` | Changes only the colored part. |\n| `resetHealthBar()` | Back to the last loaded style. |\n| `setHealthBarColors(left, right)` | The two colors. |\n\nTo flip the frame upside down (for example with downscroll), use `setProperty('healthBar.bg.flipY', true)`.\n\n## Icons\n\nIcons have up to four states (neutral, losing, winning, winning more) and can be animated: see [Health icons](03-characters.md#health-icons).\n\nExtra characters (Character 3 to 10) get their icon on the health bar too, smaller, next to the icon of the side they sing for.\n\n## Results screen\n\nAt the end of a song in Freeplay, and at the end of a week in Story Mode, the results screen shows your score, the hits of each rating and a **rank**, like in the base game.\n\nThe rank comes from the **clear**: Sick and Good hits, minus misses, divided by the number of notes.\n\n| Rank | When |\n|---|---|\n| Perfect (gold) | Every note hit as Sick. |\n| Perfect | No misses, and clear at 100%. |\n| Excellent | Clear 90% or more. |\n| Great | Clear 80% or more. |\n| Good | Clear 60% or more. |\n| Loss | Below 60%. |\n\nThe rank also shows up in Freeplay, next to the song.\n\nThe player can turn the results screen off with the **Disable Results** option. A script can skip it for one song:\n\n```lua\nfunction onResultsScreen(score, accuracy, misses)\n\treturn Function_Stop\nend\n```\n"}, {"file": "07-weeks.md", "slug": "weeks", "title": "Weeks & Menus", "markdown": "# Weeks & Menus\n\nA week is a `.json` file in `data/weeks/`. It decides which songs show up in Story Mode and Freeplay, which characters stand in the story menu, and how the menus look. Make it with the **Week Editor**.\n\n## The Week Editor\n\nOpen it from the Editor Menu.\n\n| Part | What's inside |\n|---|---|\n| **File** menu | Save (Ctrl + S), Save As, Load from JSON, Load Template. |\n| **Color** menu | **Edit Week Color**: a color picker for the week's color. |\n| **Week** tab | Songs, the three menu characters, background, display name, week file name, hide from Story Mode. |\n| **Other** tab | Locked, hidden until unlocked, the week to finish to unlock it, difficulties. |\n| **Menu Character** tab | Edit the story menu characters (see below). |\n| **Freeplay** button | Opens the Freeplay part of the editor (see below). |\n\n**Save** writes the week and, at the same time, every menu character you changed.\n\n### Week color\n\nThe story menu has a colored band behind the characters, yellow in the base game. **Color > Edit Week Color** changes it for your week. The color is saved in the week as `\"weekColor\": [red, green, blue]`.\n\n## Menu characters\n\nThe three characters in the story menu (opponent, boyfriend, girlfriend) are small `.json` files in `content/images/storymode/weekcharacters/` (the old Psych `images/menucharacters/` works too).\n\nIn the **Menu Character** tab:\n\n1. Pick **Opponent**, **Boyfriend** or **Girlfriend** (or click the character).\n2. Change the image, scale, idle and \"HEY\" animations, flip and antialiasing.\n3. Move it with the **arrow keys** (Shift = 10x). **Space** plays the \"HEY\" animation.\n\n```json\n{\n\t\"image\": \"menucharacters/my-character\",\n\t\"scale\": 1,\n\t\"position\": [0, 0],\n\t\"idle_anim\": \"my character idle\",\n\t\"confirm_anim\": \"my character hey\",\n\t\"flipX\": false,\n\t\"antialiasing\": true\n}\n```\n\n## Freeplay\n\nPress **Freeplay** in the Week Editor to see the songs as they will look in Freeplay.\n\n| Part | What's inside |\n|---|---|\n| **Freeplay** tab | Color of the selected song (red, green, blue, with copy and paste), its icon, hide the week from Freeplay. |\n| **Background** box | A background image for the selected song, from `images/`. **Use BG Color** tints the image with the song's color. **Remove** goes back to the normal background. |\n\nEach song in the week file is a list:\n\n```json\n\"songs\": [\n\t[\"my-song\", \"my-icon\", [146, 113, 253]],\n\t[\"boss-song\", \"boss-icon\", [255, 60, 60], \"freeplay/boss-bg\", true]\n]\n```\n\nSong name, icon, color, and optionally the background image and \"use BG color\".\n"}, {"file": "08-dialogues.md", "slug": "dialogues", "title": "Dialogues", "markdown": "# Dialogues\n\nMutt Engine has its own dialogue system: talking portraits with voices, backgrounds, music, sound effects, fades and screen effects. Everything is made with the **Dialogue Editor**.\n\n> The old Psych dialogue files (`dialogue.json` with `dialogue` and `portrait` lines) no longer work. The week 6 pixel dialogues still use their own system.\n\n## The files\n\nA dialogue is made of three kinds of files:\n\n| File | Where | What it is |\n|---|---|---|\n| **Dialogue** | `data/songs/<song>/dialogue.json` | The scenes, in order. |\n| **Characters** | `data/dialogue/characters/<id>.json` | Who talks: portrait, name, colors, voice. Shared by every dialogue. |\n| **Styles** | `data/dialogue/styles/<name>.json` | The look: box, fonts, text speed, hints, backgrounds. Shared by every dialogue. |\n\nImages go in `images/dialogue/`, voices and sound effects in `sounds/`, music in `music/`.\n\n### When dialogues start\n\n- `dialogue.json` starts before the song.\n- `dialogue-end.json` starts after the song.\n\n`dialogue.json` doesn't play again when you restart the song. Neither plays in the Chart Editor's playtest. Any other dialogue file in the song folder can be started from a script with `startDialogue('name')`.\n\n## A small dialogue\n\n```json\n{\n\t\"style\": \"default\",\n\t\"scenes\": [\n\t\t{\"scene\": \"normal\", \"character\": \"bf\", \"portrait\": \"happy\", \"text\": \"Beep bop!\"},\n\t\t{\"scene\": \"normal\", \"character\": \"gf\", \"portrait\": \"neutral\", \"text\": \"He says hi.\"},\n\t\t{\"scene\": \"ending\", \"fade\": true}\n\t]\n}\n```\n\n## Scene types\n\n| Type | What it does |\n|---|---|\n| `normal` | A character talks: portrait, name tag and text box. |\n| `single` | Text in the middle of the screen, without box or portrait. |\n| `wait` | Waits a few seconds (`duration`). |\n| `fade` | Fades backgrounds to an `alpha` in `duration` seconds. `target` = background IDs, or `black` (the default). |\n| `free` | Does nothing by itself: a script handles it (see below). |\n| `ending` | Ends the dialogue, with a fade if `fade` is on. |\n\nEvery scene can also:\n\n- change the **speed**, **font** and **size** of the text;\n- **advance by itself**, right away or after a delay;\n- play an **effect**: `shake` the screen, `flash` it with a color, or `textShake` the text;\n- start or stop a **music track** (it loops) and play a **sound effect**, each with volume, fade, pitch, delay and how long it plays;\n- keep the text of the scene before (`keepText`).\n\n## The Dialogue Editor\n\nOpen it from the Editor Menu. It opens the dialogue of the last played song, or a template.\n\nThe preview on the left is the real dialogue, exactly as it looks in game.\n\n| Part | What's inside |\n|---|---|\n| **File** menu | Save, Load from JSON, Load Template, Antialiasing ON/OFF, Exit. |\n| **Scene** tab | The selected scene: type, character, portrait, text, speed, effects. Buttons to duplicate, add, remove and move scenes. |\n| **Audio** tab | Music and sound of the scene, and the music of the whole dialogue. |\n| **Character** tab | The character: portrait, size, position, colors, name tag, voice, animations. |\n| **Style** tab | The style: box, text, fonts, voices, hints, backgrounds. |\n| Bottom | **Mute Editor Music**, **Mute Voices**, **Preview Music/SFX**. |\n\n**Save** writes the dialogue, and also the style and every character you changed in the mod's `data/dialogue/` folder.\n\nColor fields have a **+** button that opens a color picker. A color can be a hex code (`FF0000`), `bf` / `dad` / `gf`, or the name of a character (it uses its health bar color).\n\n| Key | Action |\n|---|---|\n| A / D | Previous / next scene |\n| Space | Replay the scene |\n| Enter | Advance the preview |\n| W / S | Previous / next portrait animation |\n| Arrow keys | Move the portrait (*Style* tab: move the box). Shift = 10x |\n| Ctrl + arrow keys | Move the offset of the portrait animation |\n| Ctrl + S | Save |\n\n## Scripts\n\n### Free scenes\n\nA `free` scene stops the dialogue and calls `onDialogueCustom` in the song's scripts. Do anything you want, then call `nextDialogueScene()` to go on:\n\n```lua\nfunction onDialogueCustom(name, index)\n\tif name == 'doorSlam' then\n\t\tplaySound('doorslam')\n\t\tcameraShake('other', 0.02, 0.5)\n\t\trunTimer('afterSlam', 0.6)\n\tend\nend\n\nfunction onTimerCompleted(tag)\n\tif tag == 'afterSlam' then\n\t\tnextDialogueScene()\n\tend\nend\n```\n\n### Functions and callbacks\n\n| Function | What it does |\n|---|---|\n| `startDialogue(?name, ?resume)` | Starts `data/songs/<song>/<name>.json`. With `resume` on, the song starts (or ends) when the dialogue is over. |\n| `nextDialogueScene()` | Goes to the next scene. |\n| `endDialogue(?fade, ?duration)` | Ends the dialogue now. |\n| `isDialogueRunning()` | `true` while a dialogue is on screen. |\n\n| Callback | When |\n|---|---|\n| `onDialogueStart(name)` | Before a dialogue starts. Return `Function_Stop` to cancel it. |\n| `onDialogueScene(index, type, character)` | At every new scene. |\n| `onDialogueCustom(name, index)` | At a `free` scene. |\n| `onDialogueEnd(name)` | When the dialogue ends. |\n\nWhile a dialogue runs, its parts can be used like any other object: `dialogue_box`, `dialogue_text`, `dialogue_black`, `dialogue_<background id>` and `dialogue_portrait_<character id>`.\n"}, {"file": "09-scripting.md", "slug": "scripting", "title": "Scripting", "markdown": "# Scripting\n\nScripts add anything the editors can't do. Mutt Engine runs **Lua** (`.lua`) and **HScript** (`.hx`, Haxe code) scripts. Every function on the [Lua API page](15-lua-api.md) works in Lua; HScript can also use the engine's classes directly.\n\n## Where scripts go\n\n| Folder | When it runs |\n|---|---|\n| `scripts/` | In every song of the mod. |\n| `data/songs/<song>/scripts/` | Only in that song. |\n| `data/stages/<stage>.lua` | In every song with that stage. |\n| `custom_events/<Event Name>.lua` | When the chart has that event. See [Charts & Songs](02-charts-and-songs.md#your-own-events). |\n| `custom_notetypes/<Note Type>.lua` | When the chart has that note type. See [Notes](05-notes.md#note-types). |\n| `states/` and `states/substates/` | Your own menus and screens (see below). |\n| `data/LoadingScreen.lua` | The loading screen. |\n\n## A first script\n\nA script is made of **callbacks**: functions with fixed names that the game calls at the right moment.\n\n```lua\nfunction onCreate()\n\tcreateText('hello', 'Hello!', 0, 100, {size = 48})\n\tscreenCenter('hello', 'x')\nend\n\nfunction onBeatHit()\n\tif curBeat % 2 == 0 then\n\t\tsetProperty('hello.angle', 10)\n\telse\n\t\tsetProperty('hello.angle', -10)\n\tend\nend\n```\n\nThe most used callbacks:\n\n| Callback | When |\n|---|---|\n| `onCreate()` / `onCreatePost()` | When the song is loading / after everything is loaded. |\n| `onSongStart()` | When the music starts. |\n| `onUpdate(elapsed)` / `onUpdatePost(elapsed)` | Every frame. |\n| `onBeatHit()` / `onStepHit()` / `onSectionHit()` | On every beat / step / section (`curBeat`, `curStep`, `curSection`). |\n| `goodNoteHit(id, direction, noteType, isSustainNote)` | The player hits a note. |\n| `opponentNoteHit(...)` / `noteMiss(...)` | The opponent hits a note / the player misses one. |\n| `onEvent(name, value1, value2, strumTime)` | A chart event is triggered. |\n| `onTweenCompleted(tag)` / `onTimerCompleted(tag, loops, loopsLeft)` | A tween or a timer ends. |\n| `onEndSong()` / `onGameOver()` / `onPause()` | End of the song / game over / pause. Return `Function_Stop` to stop it. |\n\nNew in Mutt Engine: `onCountdownStarted`, `onHoldDrop(direction, remaining)` (a hold note released too early), `onExitSong` (leaving from the pause menu), `onResultsScreen(score, accuracy, misses)` and the [dialogue callbacks](08-dialogues.md#functions-and-callbacks).\n\n## New functions\n\nMutt Engine adds many functions on top of Psych Engine's. A few examples:\n\n| Function | What it does |\n|---|---|\n| `createSprite`, `createAnimatedSprite`, `createText` | Create **and add** an object in one line, with an options table. |\n| `createBackdrop`, `createParticles`, `createGradient` | Scrolling backgrounds, particles, gradients. |\n| `startTween`, `noteTween`, `tweenNumber`, `tweenShader` | Tween several values at once. `pauseTween` / `resumeTween` work on all of them. |\n| `focusCamera`, `centerCamera` | Move the camera like the Cam Follow Pos and Center Camera events. |\n| `setCharacterPos`, `setCamOffset` | Move a character, or the spot its camera looks at. |\n| `typeText` | Writes a text letter by letter. |\n| `switchState(name, {transition = ...})` | Changes screen with a fade, stickers or nothing. |\n| `autoPlay(true)` | The game plays by itself, but it counts as real play. |\n| Window functions | Move, resize, tween, rename the game window. |\n| `string.split`, `table.contains`, `math.clamp`... | Small helpers added to the Lua standard library. |\n\n### Options tables\n\nMany new functions take a table of options as the last value. Write only the options you need, by name:\n\n```lua\ncreateSprite('sky', 'stages/park/sky', -400, -300, {scrollX = 0.2, scrollY = 0.2, alpha = 0.8})\nstartTween('fade', 'sky', {alpha = 0}, 2, {ease = 'sineOut', startDelay = 1})\n```\n\n### Deprecated functions\n\nSome old functions have a better replacement (for example `makeLuaSprite` + `addLuaSprite` became `createSprite`). They still work. With `luaDebugMode = true` the game shows a warning once, with the name of the replacement. The [Lua API page](15-lua-api.md) marks them as **DEPRECATED**.\n\n## Custom states\n\nA custom state is your own screen: a menu, a gallery, a credits page. Put a script in `states/` and open it with `switchState('MyState')`.\n\n```lua\n-- states/MyState.lua\nfunction onCreate()\n\tcreateText('title', 'My Gallery', 0, 80, {size = 64})\n\tscreenCenter('title', 'x')\nend\n\nfunction onUpdate(elapsed)\n\tif keyJustPressed('back') then\n\t\tswitchState('MainMenuState')\n\tend\nend\n```\n\n- Name the file like a built-in state (`MainMenuState.lua`, `FreeplayState.lua`...) to **replace** it.\n- Return `true` from `isInitialState()` to make the game boot into your state instead of the title screen (only for files directly in `states/`).\n- Substates go in `states/substates/` and open on top of the current state with `openSubState('Name')`. Close them with `closeSubState()`.\n- If both `MyState.hx` and `MyState.lua` exist, the `.hx` one is used.\n- Custom states only work when one mod is active (see [Getting Started](01-getting-started.md#choosing-mods)).\n\nState scripts have some functions of their own (songs, weeks, scores, loading bar): the API page marks them as **STATE**.\n\n## The loading screen\n\n`data/LoadingScreen.lua` changes the loading screen. It gets `onCreate`, `onUpdate` and `onLoad`, the objects `bar` and `barBack` (the loading bar), and the functions `getLoaded()` and `getLoadMax()`.\n\n## Writing scripts in VS Code\n\n**DogO-01** is a Visual Studio Code extension made for Mutt Engine. It knows every function, callback and variable, warns about deprecated functions, suggests the images, sounds and other files of your mod while you type, checks the JSON files and creates new scripts from templates.\n\nInstall it from `dogo-01-1.3.0.vsix`: in VS Code, *Extensions* > `...` > **Install from VSIX**.\n"}, {"file": "10-shaders.md", "slug": "shaders", "title": "Shaders", "markdown": "# Shaders\n\nShaders are small programs that change how things are drawn: colors, blur, glow, distortion. They are `.frag` files in `content/shaders/`, the same kind of shaders Psych Engine uses.\n\n## The Shader Editor\n\nThe Shader Editor puts shaders on a stage **without writing scripts**. The shaders are saved inside the stage file and start by themselves in every song with that stage.\n\nOpen it from the Editor Menu, then pick a stage.\n\n| Part | What's inside |\n|---|---|\n| **Stage** tab | The stage to edit, Reload, Save. |\n| **Characters** tab | Which characters to show in the preview (only for the editor). |\n| **Shaders** box | The list of shaders of the stage. For each one: the `.frag` file, the **target**, a name, and the starting value of every setting. |\n| **Lighting Editor** | RTX lighting for characters (see below). |\n\nThe **target** is what the shader is drawn on: a camera (`camGame`, `camHUD`, `camOther`), a character (BF, Dad, GF, extra characters) or an object of the stage. More shaders on the same camera are applied in order: use **Move Up** to change it.\n\nValues are written like this: a number for `float` and `int`, `1, 0.5, 0` for `vec2`/`vec3`/`vec4`, `true` or `false` for `bool`, an image path for `sampler2D`. Empty = the shader's default.\n\n| Key | Action |\n|---|---|\n| E / Q, mouse wheel | Zoom in / out |\n| J / K / L / I, mouse drag | Move the camera |\n| R | Reset the camera |\n| P | Reload the stage |\n| Ctrl + S | Save |\n\n### RTX lighting\n\nThe **Lighting Editor** adds rim lighting to a character, to make it match the light of the stage. Pick a character and change:\n\n- **Overlay**: brightens the character with a color.\n- **Satin**: multiplies the character by a color.\n- **Inner Shadow**: lights the edges facing a direction, with an angle and a distance.\n\n## Shaders in scripts\n\n```lua\nfunction onCreate()\n\taddCameraShader('camGame', 'glow')\n\tsetShaderFloat('camGame:glow', 'intensity', 0)\nend\n\nfunction onBeatHit()\n\tif curBeat == 32 then\n\t\ttweenShader('glowUp', 'camGame:glow', {intensity = 1}, 2, {ease = 'sineOut'})\n\tend\nend\n```\n\n### Which shader?\n\nEvery shader function takes the object that has the shader:\n\n| You write | Shader |\n|---|---|\n| `'myBackground'` | The shader of an object or character. |\n| `'camGame:glow'` | The shader named `glow` on the game camera. `'camGame'` alone = its first shader. |\n| `'stage:glow'` | The shader named `glow` added in the Shader Editor. |\n\n### Functions\n\n| Function | What it does |\n|---|---|\n| `initLuaShader(name)` | Loads a shader before using it. |\n| `setSpriteShader(obj, shader)` / `removeSpriteShader(obj)` | Puts / removes a shader on an object. |\n| `addCameraShader(camera, shader, ?name)` | Adds a shader to a camera, after the ones it already has. |\n| `setCameraShader(camera, shader)` | Replaces all the shaders of a camera with one. |\n| `removeCameraShader(camera, ?name)` | Removes one shader (by name) or all of them. |\n| `getCameraShaders(camera)` | Names of the shaders on a camera, in order. |\n| `setShaderFloat`, `setShaderInt`, `setShaderBool`... | Change a value of a shader. |\n| `getShaderFloat`, `getShaderInt`, `getShaderBool`... | Read a value. |\n| `setShaderSampler2D(obj, prop, image)` | Sends an image to a shader. |\n| `tweenShader(tag, obj, values, duration, ?options)` | Tweens several values at once, of any type (numbers, vectors, colors). |\n| `tweenShaderFloat(tag, obj, uniform, value, duration, ?options)` | Tweens one number. |\n\nThe old `setCameraShaderFloat` and friends still work, but `setShaderFloat('camGame:name', ...)` replaces them.\n"}, {"file": "11-modcharts.md", "slug": "modcharts", "title": "Modcharts", "markdown": "# Modcharts\n\nA modchart moves, spins, hides or bends the notes and the strums during a song. Mutt Engine's modcharts are based on [TheZoroForce240's Modcharting Tools](https://github.com/TheZoroForce240/FNF-Modcharting-Tools), with an editor made to be easy.\n\nA modchart is saved as `data/songs/<song>/modchart.json` and plays by itself with the song.\n\n## The words\n\n| Word | Meaning |\n|---|---|\n| **Modifier** | An effect on the notes, like moving them sideways or making them drunk. It has a name, a type and a value. |\n| **Event** | Changes the value of one or more modifiers at a beat, over a duration, with an ease. |\n| **Playfield** | A copy of the strumlines. Use it for effects with two sets of arrows on screen. |\n\nA modifier can affect all the notes, only the player's (`PLR`), only the opponent's (`OPP`), one lane (`0`-`3` opponent, `4`-`7` player, `8`+ extra strumlines) or the strumline of an extra character (`C`).\n\n## The Modchart Editor\n\nOpen it from the Editor Menu, or with the **Modchart** debug key during a song (Developer Mode on).\n\n1. Press **New** to create a modifier: choose the effect, the notes it affects, and give it a name.\n2. **Right click** on the modifier's row, under the preview, to add an event.\n3. Click the event to change its value, beat, duration and ease in the side panel.\n4. Press **Space** to watch the modchart.\n\nTo bring a modifier back to normal, add another event later with value 0.\n\n**File > Example Modchart** loads a ready example to play with. Press **F1** for the full help.\n\n| Key | Action |\n|---|---|\n| Space | Play / pause |\n| A / D, Left / Right | One beat back / forward |\n| Mouse wheel | Scroll the timeline (Shift = faster) |\n| Ctrl + mouse wheel | Zoom the timeline |\n| Home / End | Start / end of the song |\n| [ / ] | Playback speed (Alt = reset) |\n| Right click on a row | New event |\n| Drag an event / its tail | Move it / change its duration |\n| Delete | Delete the event |\n| Ctrl + C / Ctrl + V | Copy / paste at the current position |\n| Ctrl + Z / Ctrl + Shift + Z | Undo / redo |\n| Ctrl + S | Save |\n| Enter | Playtest |\n\nOne event can change more modifiers at once: use **Add** and the arrows in the event panel.\n\n## Modcharts in scripts\n\nModcharts can also be written in a song script, with the same functions as Modcharting Tools:\n\n```lua\nfunction onCreatePost()\n\tstartMod('wave', 'DrunkXModifier', '', -1)\n\tease(16, 4, 'sineInOut', '1, wave')\n\tease(32, 2, 'sineInOut', '0, wave')\nend\n```\n\n| Function | What it does |\n|---|---|\n| `startMod(name, modClass, ?type, ?playfield)` | Creates a modifier. `type`: `all`, `player`, `opponent`, `lane` or `character`. |\n| `setMod(name, value)` / `setSubMod(name, sub, value)` | Sets a value right away. |\n| `set(beat, 'value, name')` | Sets a value at a beat. |\n| `ease(beat, duration, ease, 'value, name')` | Tweens a value at a beat. |\n| `tweenModifier(name, value, time, ease)` | Tweens a value now. |\n| `setModTargetLane(name, lane)` | The lane (or character number) of a `lane` / `character` modifier. |\n| `addPlayfield(?x, ?y, ?z)` / `removePlayfield(index)` | Add / remove a playfield. |\n\nThe modifier classes (`DrunkXModifier`, `TipsyYModifier`, `ReverseModifier`...) are the ones listed in the editor's **New** window.\n"}, {"file": "12-translations.md", "slug": "translations", "title": "Translations", "markdown": "# Translations\n\nTranslations work like in Psych Engine. A language is a `.lang` text file, plus translated images if you need them. The player picks the language in **Options > Language**.\n\n## FILE DIRECTORY\n\n```\nmy-mod/\n  content/\n    translations/\n      it-IT/\n        data/\n          it-IT.lang\n        images/\n          ...translated images\n```\n\nThe folder name and the file name are the language code, like `it-IT` or `pt-BR`. The old Psych place, `data/it-IT.lang`, still works.\n\n## .lang files\n\nThe first line is the name shown in the language menu. Every other line is `key: \"text\"`. Lines starting with `//` are comments.\n\n```\nItaliano\n\n// Main menu\nmy_mod_welcome: \"Benvenuto!\"\nscore_text: \"Punti: {1} | Errori: {2} | Valutazione: {3}\"\n```\n\n- `{1}`, `{2}`... are values the game puts in by itself.\n- `\\n` makes a new line.\n- A mod can translate its own texts and also replace the engine's ones. The full list of engine keys is in `assets/translations/pt-BR/data/pt-BR.lang`.\n\n## TRANSLATED IMAGES\n\nTo use another image for a language, add a line with the image path as the key:\n\n```\nimages/mainmenu/menu_credits: \"translations/it-IT/images/mainmenu/menu_credits\"\n```\n\nNow the game loads the Italian image every time it asks for `images/mainmenu/menu_credits`.\n\n## SCRIPTING\n\n```lua\nlocal text = getTranslationPhrase('my_mod_welcome', 'Welcome!')\n```\n\nThe second value is used when the current language has no translation for that key.\n\n| Function | Description |\n|---|---|\n| `getTranslationPhrase(key, ?default, ?values)` | Translated text. `values` fills `{1}`, `{2}`... |\n| `setTranslationPhrase(key, text)` | Changes a translation while the game runs. |\n| `getFileTranslation(path)` | Path of the translated file, or the same path if there is none. |\n| `setFileTranslation(path, newPath)` | Changes a translated file while the game runs. |\n"}, {"file": "13-options.md", "slug": "options", "title": "Options", "markdown": "# Options\n\nOptions have been completely **re-organized from scratch!**\nThis page covers the new SETTINGS and CHANGES made for the `Options state` and its `substates`!\n\n## Preferences\n\n| Option | Description |\n|---|---|\n| **Naughtyness** | Same as V-Slice with a few additions. |\n| **Subtitles** | Subtitles for cutscenes, songs and videos. |\n| **Unfocused Volume** | Volume of the game when not in focus. |\n| **Input Overlay** | Small window on left side with Keys, NPS, BPM and Hold Timer |\n| **Smooth Health Bar** | Self-explanatory, similar to V-Slice. |\n| **Note Camera** | Camera moves on note hit. Two modes: **SIMPLE** and **ADVANCED**. |\n| **Note Camera Intensity** | Value goes from 1-10, changes how fast and strong movement is. |\n| **Note Camera Ease** | Ease for camera, ONLY for ADVANCED. |\n| **Hide Mouse** | Hides the mouse in-game except Main Menu and Editors |\n\n## Notes\n\n| Option | Description |\n|---|---|\n| **Strumline Background** | BG for Strumline so you can see better. |\n| **Hold Note Tail** | Hold Note tails position, **Front** uses V-Slice style, **Behind** is best used for modcharts, \"legacy\" styled notes. |\n| **Quant Notes** | Applies Note Quantization for all songs. |\n\n## Lag Adjustment\n\nTaken from V-Slice cause it's cooler and more sigma. Changes Input Offsets and timing. On \"Offset Calibration\", there are a few easter eggs to find if you keep spamming the UP key :)\n\n## Graphics\n\n| Option | Description |\n|---|---|\n| **V-Sync** | Uses monitor's refresh rate. You already know this lol. |\n| **Unlocked Framerate** | UNCAPPED framerate (might cause lag or issues in-game) |\n| **Resolution** | *Fullscreen*, *Borderless* or *Windowed*. F11 and Alt+Enter to switch between modes. |\n| **GPU Caching** | Saves cache memory in GPU rather than RAM for a more optimized experience (DO NOT ENABLE IF YOUR GPU SUCKS OR YOU DON'T HAVE A DEDICATED GRAPHICS CARD) |\n\n## Gameplay\n\n| Option | Description |\n|---|---|\n| **Input System** | *Psych*: normal Psych Engine input. *V-Slice*: base game's input and scoring (no ghost tapping). *Legacy*: old Psych input, hold notes DO NOT count as single notes. |\n| **Safe Frames** | Safe Frames... I don't use this much. |\n| **Disable Results** | Skips the Results screen at the end of songs. |\n\n## Debug\n\n| Option | Description |\n|---|---|\n| **Developer Mode** | Enables Editors (press 6 on Main Menu) and the new in-game DEBUG MODE (Ctrl+Shift+Enter) |\n| **Debug Display** | FPS and Memory, three modes: *Simple*, *Simpler* or *Advanced*, *OFF* to disable (use F6 to toggle between modes) |\n| **Debug Display BG** | Display BG opacity, duh. |\n| **Allow Screenshots** | If unchecked, screenshot are permanently disabled including hotkey. |\n\n## For modders: Naughtyness\n\nIf \"Naughtyness\" is unchecked, the game will check for two types of files in this order:\n\n```txt \n'-censored' --> '_safe' --> File without suffixes\n```\n\nHere's an example:\n\n- **Videos**: `videos/my-cutscene-censored.mp4` is played instead of `my-cutscene.mp4`.\n- **Subtitles**: `my-cutscene-censored.json` is used instead of `my-cutscene.json`.\n- **Characters**: a character's `.json` can name a `censored_character` to use instead.\n\nFor scripts, a global variable **`naughtyness`** can be used for certain conditions:\n\n```lua\nfunction onCreate()\n\tif not naughtyness then\n\t\tsetTextString('sign', 'Have a nice day')\n\tend\nend\n```\n\nAdditionally, you can add the value to a variable this way:\n\n```lua\nlocal badwords = getPropertyFromClass('funkin.save.ClientPrefs', 'data.naughtyness')\n```\n\nOr simply:\n\n```lua\nlocal badwords = naughtyness\n-- NOTE: badwords is a BOOLEAN variable, not STRING! (like ofc lol)\n```\n"}, {"file": "14-building.md", "slug": "building", "title": "Building Mutt Engine", "markdown": "# Building Mutt Engine\n\nThis page shows the necessary steps for **COMPILING** a source code build of Mutt Engine.\nMutt Engine is built for **Windows** and as of now there are no plans for Mac or Linux ports (sorry).\n\n## Requirements\n\n1. **Haxe 4.3.4 or newer**: [haxe.org/download](https://haxe.org/download/).\n2. **Git**: [git-scm.com](https://git-scm.com/downloads).\n3. **Visual Studio 2019 or 2022** (the free Community edition or the Build Tools), with these parts selected in the installer:\n   - *MSVC v142 (or newer) - VS C++ x64/x86 build tools*\n   - *Windows 10 SDK (10.0.19041.0)*\n\n## Libraries\n\nRun these commands by terminal or Powershell. Use the **exact versions** or else it will FAIL to compile.\n\n```bat\nhaxelib install hxcpp 4.3.2\nhaxelib install lime 8.1.2\nhaxelib install openfl 9.3.3\nhaxelib install flixel 5.6.1\nhaxelib install flixel-addons 3.2.2\nhaxelib install tjson 1.4.0\nhaxelib install hscript-iris 1.1.3\nhaxelib install hxvlc 2.3.0\nhaxelib install hxdiscord_rpc 1.2.4\nhaxelib install away3d 5.0.9\nhaxelib git linc_luajit https://github.com/superpowers04/linc_luajit\nhaxelib git flxanimate https://github.com/Dot-Stuff/flxanimate\nhaxelib git funkin.vis https://github.com/FunkinCrew/funkVis\nhaxelib git grig.audio https://gitlab.com/haxe-grig/grig.audio.git\nhaxelib run lime setup\n```\n\n| Library | Used for |\n|---|---|\n| `hxcpp` | Turns the Haxe code into C++. |\n| `lime`, `openfl` | Window, graphics, sound and files. |\n| `flixel`, `flixel-addons` | The game framework. |\n| `tjson` | Reading JSON files. |\n| `linc_luajit` | Lua scripts. |\n| `hscript-iris` | HScript scripts. |\n| `hxvlc` | Videos. |\n| `hxdiscord_rpc` | Discord status. |\n| `flxanimate` | Adobe Animate texture atlases. |\n| `funkin.vis`, `grig.audio` | The speaker visualizer of the base game stages. |\n| `away3d` | 3D objects. |\n\n`flixel-animate` was added as an external library due to compiling issues. It can be found inside `libs/flixel-animate`.\n\n**NOTE (for programmers):** Part of this engine was made with the assistance of AI. I'm not an expert programmer and I don't know source coding well. This is not meant to be a serious thing but rather just a fun project I wanted to make for myself. Source code is on GitHub but it will not be distributed nor shared publicly online, unless a different decision is made.\n\nPlease don't come harassing me for this, it's not that deep. I don't even feel proud for making this at all!\n\nIt's actually meant to be a \"base\" or \"mock-up\" for a new version of Psych Engine made by real people who know programming and are not fat chuds like me (I'm serious, btw).\n\n## Compiling\n\nSame as Psych Engine. On the main directory of the folder you installed the source code (aka where `Project.xml` is located), run this command in **`Command Prompt / Powershell`**:\n\n```bat\nlime test windows\n```\n\nAdditionally, if you want to compile without opening the game:\n\n```bat\nlime build windows\n```\n\nThen `lime run windows` to start the application.\n\n## Useful folders\n\n| Folder | Description |\n|---|---|\n| `assets/` | Base game files, including custom assets loaded inside. |\n| `assets/embed/` | Files hidden in the **executable file** that aren't accessible to the public UNLESS you have the source code. Similar to what Sonic Legacy does. |\n| `loaded-mods/` | Mods that are automatically loaded in `mods/`, only if `MODS_ALLOWED` is enabled and `STANDALONE_BUILD` is disabled in `Project.xml` |\n| `source/` | Engine's source code. `funkin/` contains majority of the engine's core functions, while the rest is used for libraries. |\n\n## Build options\n\nThe options are `<define>` lines at the top of `Project.xml`. Remove a line to turn that feature off.\n\n| Option | Description |\n|---|---|\n| `MODS_ALLOWED` | Toggles `mods/` and mod support. |\n| `LUA_ALLOWED` | Lua scripting. |\n| `HSCRIPT_ALLOWED` | HScript scripting. |\n| `VIDEOS_ALLOWED` | Toggles Videos playback. |\n| `DISCORD_ALLOWED` | Toggles Discord RPC. |\n| `ACHIEVEMENTS_ALLOWED` | Toggles Achievements. |\n| `TRANSLATIONS_ALLOWED` | Enables Language options. |\n| `MULTITHREADED_LOADING` | Better asset loading, faster loading times. |\n| `CRASH_HANDLER` | Enables crash handler and `crash/` folder upon fatal error. |\n"}, {"file": "15-lua-api.md", "slug": "lua-api", "title": "Lua API", "markdown": "# Lua API\n\nEvery Lua function of Mutt Engine, by category.\n\n- **NEW** = added by Mutt Engine. **CHANGED** = works differently than in Psych Engine.\n- **DEPRECATED** = still works, but use the function written next to it. With `luaDebugMode = true` the game shows a warning.\n- **STATE** = only in custom state scripts (see [Scripting](09-scripting.md#custom-states)).\n- `?` before a value = optional. `{...}` = an options table: write only the options you need, by name (`{alpha = 0.5}`).\n\nThis page is made from the same list used by the **DogO-01** VS Code extension.\n\n## Scripts & variables\n\n| Function | What it does |\n|---|---|\n| `getRunningScripts()` | Lists the running scripts. |\n| `setOnScripts(varName:String, arg:Dynamic, ?ignoreSelf:Bool = false, ?exclusions:Array<String> = null)` | Sets a variable in every script (Lua and HScript). |\n| `setOnHScript(varName:String, arg:Dynamic, ?ignoreSelf:Bool = false, ?exclusions:Array<String> = null)` | Sets a variable in HScripts only. |\n| `setOnLuas(varName:String, arg:Dynamic, ?ignoreSelf:Bool = false, ?exclusions:Array<String> = null)` | Sets a variable in Lua scripts only. |\n| `callOnScripts(funcName:String, ?args:Array<Dynamic> = null, ?ignoreStops=false, ?ignoreSelf:Bool = true, ?excludeScripts:Array<String> = null, ?excludeValues:Array<Dynamic> = null)` | Calls a function in every script. |\n| `callOnLuas(funcName:String, ?args:Array<Dynamic> = null, ?ignoreStops=false, ?ignoreSelf:Bool = true, ?excludeScripts:Array<String> = null, ?excludeValues:Array<Dynamic> = null)` | Calls a function in Lua scripts only. |\n| `callOnHScript(funcName:String, ?args:Array<Dynamic> = null, ?ignoreStops=false, ?ignoreSelf:Bool = true, ?excludeScripts:Array<String> = null, ?excludeValues:Array<Dynamic> = null)` | Calls a function in HScripts only. |\n| `callScript(luaFile:String, funcName:String, ?args:Array<Dynamic> = null)` | Calls a function in one specific script. |\n| `isRunning(scriptFile:String)` | Checks if a script is running. |\n| `setVar(varName:String, value:Dynamic)` | Saves a value shared between scripts. |\n| `getVar(varName:String)` | Reads a value saved with setVar. |\n| `addLuaScript(luaFile:String, ?ignoreAlreadyRunning:Bool = false)` | Starts another Lua script. |\n| `addHScript(scriptFile:String, ?ignoreAlreadyRunning:Bool = false)` | Starts another HScript. |\n| `removeLuaScript(luaFile:String)` | Stops a Lua script. |\n| `removeHScript(scriptFile:String)` | Stops an HScript. |\n| `getModSetting(saveTag:String, ?modName:String = null)` | Reads a mod option (settings.json). |\n| `debugPrint(text:Dynamic = '', color:String = 'WHITE')` | Prints a debug message on screen. |\n| `close()` | Closes this script. |\n\n## Song & gameplay\n\n| Function | What it does |\n|---|---|\n| `loadSong(?name:String = null, ?difficulty:Dynamic = -1)` | Loads and starts another song. |\n| `addCharacterToList(name:String, type:String)` | **DEPRECATED** - use `precacheCharacter`<br>Preloads a character. |\n| `precacheImage(name:String, ?allowGPU:Bool = true)` | Preloads an image. |\n| `precacheSound(name:String)` | Preloads a sound. |\n| `precacheMusic(name:String)` | Preloads music. |\n| `triggerEvent(name:String, ?value1:String = '', ?value2:String = '', ?value3:String, ?value4:String, ?value5:String, ?value6:String, ?value7:String, ?value8:String, ?value9:String, ?value10:String)` | Triggers a chart event (up to 10 values). |\n| `autoPlay(?on:Bool)` | **NEW**<br>Turns autoplay on or off: the game hits the notes for the player like botplay, but it counts as real play (no BOTPLAY text, normal score, records are saved). The player's keys are ignored while it's on. Without an argument it only tells you if it's on. Returns true if autoplay is on. Every note is hit as Sick, so accuracy is 100% in those parts. Also in HScript. |\n| `startCountdown()` | Starts the countdown (if it was blocked). |\n| `endSong()` | Ends the song. |\n| `switchStateWithStickers(stateName:String, ?mode:String, ?songName:String, ?difficulty:String)` | **DEPRECATED** - use `switchState(name, {transition = \"stickers\"})`<br>Switches state with the sticker transition. |\n| `switchStateDirect(stateName:String)` | **DEPRECATED** - use `switchState(name, {transition = \"none\"})`<br>Switches state with no transition. |\n| `switchState(stateName:String, ?options:{transition, mode, song, difficulty})` | **CHANGED**<br>Switches state. transition = \"fade\" (default), \"none\" or \"stickers\". Now replaces switchStateDirect and switchStateWithStickers. |\n| `restartSong(?skipTransition:Bool = false)` | Restarts the song. |\n| `exitSong(?skipTransition:Bool = false)` | Leaves the song and goes back to the menu. |\n| `getSongPosition()` | Current song time (ms). |\n| `startDialogue(?name = \"dialogue\", ?resume = true)` | **CHANGED**<br>Starts a dialogue of this song: data/songs/<song>/<name>.json (e.g. \"dialogue-mid\"). The HUD is hidden and pause is off until it ends. resume = true: when it ends, the countdown starts (or the song ends, if it was the end dialogue). Returns false if the file is missing. Changed in 1.3. dialogue.json and dialogue-end.json start by themselves (start and end of the song, only once, not in charting mode). The old Psych dialogue files no longer work. Made with the Dialogue Editor. |\n| `nextDialogueScene()` | **NEW**<br>Skips to the next scene of the running dialogue (like pressing Enter). Returns false if no dialogue is running. New in 1.3. |\n| `endDialogue(?fade = true, ?duration = 1)` | **NEW**<br>Ends the running dialogue. fade = true fades it out in duration seconds. Returns false if no dialogue is running. New in 1.3. |\n| `isDialogueRunning()` | **NEW**<br>True while a dialogue is on screen. New in 1.3. |\n| `onDialogueStart / onDialogueScene / onDialogueCustom / onDialogueEnd` | **NEW**<br>onDialogueStart(name) - return Function_Stop to cancel it. onDialogueScene(index, type, character) - every new scene. onDialogueCustom(name, index) - a \"free\" scene: call nextDialogueScene() when your effect is done. onDialogueEnd(name). New in 1.3. Objects: dialogue_<bg id>, dialogue_portrait_<character>, dialogue_black, dialogue_box, dialogue_text. |\n| `startVideo(videoFile:String, ?canSkip:Bool = true, ?forMidSong:Bool = false, ?shouldLoop:Bool = false, ?playOnLoad:Bool = true)` | Plays a video. |\n| `setReturnState(stateName:String)` | Sets where the game goes after the song. |\n| `getReturnState()` | Reads where the game goes after the song. |\n| `openCustomSubstate((= openCustomSubstate))` | Opens a custom substate. |\n| `closeCustomSubstate((= closeCustomSubstate))` | Closes the custom substate. |\n| `insertToCustomSubstate((= insertToCustomSubstate))` | Adds an object to the custom substate. |\n| `precacheCharacter(name, ?type = \"bf\" \\| \"dad\" \\| \"gf\" \\| 3..10 \\| \"character3\")` | **NEW**<br>Preloads a character so changing it later doesn't stutter. Also works with extra characters (number or \"character3\"). |\n\n## Score, health & HUD\n\n| Function | What it does |\n|---|---|\n| `addScore(value:Int = 0)` | Adds score. |\n| `addMisses(value:Int = 0)` | Adds misses. |\n| `addHits(value:Int = 0)` | Adds hit notes. |\n| `setScore(value:Int = 0)` | Sets the score. |\n| `setMisses(value:Int = 0)` | Sets the misses. |\n| `setHits(value:Int = 0)` | Sets the hit notes. |\n| `setHealth(value:Float = 1)` | Sets health (0-2). |\n| `addHealth(value:Float = 0)` | Adds health. |\n| `getHealth()` | Reads health. |\n| `setRatingPercent(value:Float)` | Sets the accuracy percent. |\n| `setRatingName(value:String)` | Sets the rating name. |\n| `setRatingFC(value:String)` | Sets the FC tag (SFC, GFC...). |\n| `updateScoreText()` | Refreshes the score text. |\n| `setHealthBarColors(left:String, right:String)` | Health bar colors. |\n| `setHealthBarBG(?image, ?prefix, ?fps)` | **NEW**<br>Replaces the health bar frame (drawn on top) with an image from images/. It is scaled and centered on the normal health bar by itself. With an .xml next to it, it plays as an animation (prefix = animation prefix, fps = speed, default 24). Empty = back to the mod's frame or the normal one. Mods with the new folder structure can also put bg.png in content/images/healthbar/ to use it in every song. |\n| `setHealthBarSprite(?image, ?prefix, ?fps)` | **NEW**<br>Replaces the colored part of the health bar with an image (any shape, white is best). It is tinted with the health bar colors, so setHealthBarColors still works. Scaled to the width of the normal bar and centered. Animated with an .xml like setHealthBarBG. Empty = back to the mod's bar or the normal one. JSON version: data/songs/<song>/healthbar.json (that song) or data/healthbar.json (whole mod) with bg, bar (paths inside images/), scale, offset, barScale ([x, y] or one number, only the colored bar), barOffset ([x, y], moves only the colored bar), iconScale, iconOffset, iconBop, bgAnimation, barAnimation. Old folder content/images/healthbar/ still works. |\n| `resetHealthBar()` | **NEW**<br>Puts the health bar back to the last loaded style (song or mod healthbar.json, or the normal one). |\n| `loadHealthBar(?path:String)` | **NEW**<br>Loads a health bar style from a JSON inside data/ (e.g. 'healthbars/sonic' = data/healthbars/sonic.json), same fields as healthbar.json. Returns false if the file is missing. Empty = back to the song/mod healthbar.json. |\n| `setTimeBarColors(left:String, right:String)` | Time bar colors. |\n\n## Characters\n\n| Function | What it does |\n|---|---|\n| `setCharacterPos(character = \"bf\" \\| \"dad\" \\| \"gf\" \\| 3..10 \\| \"character3\", ?x, ?y, ?zIndex)` | **NEW**<br>Moves a character's group. x or y = nil keeps that coordinate. zIndex moves the character to another layer, like objects (0 = behind everything, the background too). Replaces setCharacterX and setCharacterY. Returns true if the character exists. |\n| `getCharacterPos(character = \"bf\" \\| \"dad\" \\| \"gf\" \\| 3..10 \\| \"character3\")` | **NEW**<br>Position and layer of a character's group: returns {x, y, zIndex} (use pos.x, pos.y, pos.zIndex). nil if the character doesn't exist. Replaces getCharacterX and getCharacterY. |\n| `setCamOffset(character = \"bf\" \\| \"dad\" \\| \"gf\" \\| 3..10 \\| \"character3\", ?x, ?y)` | **NEW**<br>Changes the camera offset of a character (the Camera X/Y set in the Character Editor). x or y = nil keeps that value. Useful when a stage needs the camera in another spot for that character. Works from the next camera move (next section or event). Returns true if the character exists. |\n| `getCamOffset(character = \"bf\" \\| \"dad\" \\| \"gf\" \\| 3..10 \\| \"character3\")` | **NEW**<br>Camera offset of a character: returns {x, y} (use off.x, off.y). nil if the character doesn't exist. |\n| `getCharacterX(type = \"bf\" \\| \"dad\" \\| \"gf\" \\| 3..10 \\| \"character3\")` | **DEPRECATED** - use `getCharacterPos`<br>X of a character's group. Also works with extra characters (number or \"character3\"). |\n| `setCharacterX(type = \"bf\" \\| \"dad\" \\| \"gf\" \\| 3..10 \\| \"character3\", value)` | **DEPRECATED** - use `setCharacterPos`<br>Moves a character's group on X. Also works with extra characters (number or \"character3\"). |\n| `getCharacterY(type = \"bf\" \\| \"dad\" \\| \"gf\" \\| 3..10 \\| \"character3\")` | **DEPRECATED** - use `getCharacterPos`<br>Y of a character's group. Also works with extra characters (number or \"character3\"). |\n| `setCharacterY(type = \"bf\" \\| \"dad\" \\| \"gf\" \\| 3..10 \\| \"character3\", value)` | **DEPRECATED** - use `setCharacterPos`<br>Moves a character's group on Y. Also works with extra characters (number or \"character3\"). |\n| `characterDance(character = \"bf\" \\| \"dad\" \\| \"gf\" \\| 3..10 \\| \"character3\")` | **CHANGED**<br>Makes a character dance (idle). Also works with extra characters (number or \"character3\"). |\n| `setSingAlong(father, ?children, ?all = false)` | **NEW**<br>Makes characters sing together: the children copy every sing animation of the father, misses too. father and children: bf, dad, gf, 3..10 or \"character3\"; children as text \"3, 4\" or table {3, 4}. all = true: every character on the father's side. No children and all off = the father sings alone again. Same as the Character Sing-Along event. Returns false if the father isn't a valid name. |\n| `getSingAlong(father)` | **NEW**<br>Table of who is singing along with the father (\"bf\", \"dad\", \"gf\", \"3\"...). Empty = nobody. |\n| `getExtraCharacters()` | **NEW**<br>Table of the chart's extra characters. Each one has: slot (3..10), name (\"character3\", use it in getProperty, playAnim...), character (loaded character, empty = the side sings), parent (bf, dad or gf), strumline (\"shared\" or \"separate\"), playable (true = the player plays its notes), visible (has a visible strumline of its own). |\n\n## Camera\n\n| Function | What it does |\n|---|---|\n| `cameraSetTarget(target:String)` | **DEPRECATED** - use `focusCamera`<br>Moves the camera to dad, bf or gf (old system). |\n| `setCameraScroll(x:Float, y:Float)` | Sets the camera scroll. |\n| `setCameraFollowPoint(x:Float, y:Float)` | **DEPRECATED** - use `focusCamera(\"x, y\", duration, ease)`<br>Sets the camera follow point. |\n| `addCameraScroll(?x:Float = 0, ?y:Float = 0)` | Adds to the camera scroll. |\n| `addCameraFollowPoint(?x:Float = 0, ?y:Float = 0)` | Nudges the camera follow point. |\n| `getCameraScrollX()` | Camera center X (not the real scroll, despite the name). |\n| `getCameraScrollY()` | Camera center Y (not the real scroll, despite the name). |\n| `getCameraFollowX()` | X of the camera follow point. |\n| `getCameraFollowY()` | Y of the camera follow point. |\n| `cameraShake(camera:String, intensity:Float, duration:Float)` | Shakes a camera. |\n| `cameraFlash(camera:String, color:String, duration:Float,forced:Bool)` | Flashes a camera with a color. |\n| `cameraFade(camera:String, color:String, duration:Float, forced:Bool, ?fadeOut:Bool = false)` | Fades a camera to a color. |\n| `setCameraRotation(camera:String, angle:Float)` | Rotates a camera. |\n| `getCameraRotation(camera:String)` | Reads a camera's rotation. |\n| `setCameraZoom(zoom:Float)` | Sets the camera zoom. |\n| `getCameraZoom()` | Reads the camera zoom. |\n| `setCameraScrollX(x:Float)` | **CHANGED**<br>Camera scroll X. Now also in game. |\n| `setCameraScrollY(y:Float)` | **CHANGED**<br>Camera scroll Y. Now also in game. |\n| `getCameraScrollRawX()` | **CHANGED**<br>Real camera scroll X. Now also in game. |\n| `getCameraScrollRawY()` | **CHANGED**<br>Real camera scroll Y. Now also in game. |\n| `focusCamera(position, ?duration, ?ease, ?forced = true)` | **NEW**<br>Moves the camera like the Cam Follow Pos event (dad, bf, gf, char number 3, 4..., \"x, y\", \"bf, 50, 20\", \"3, 100, -50\"). No ease = stage camera speed. Now accepts an extra character number, with offsets too. |\n| `centerCamera(?duration, ?ease)` | **NEW**<br>Centers the camera between player and opponent, like the Center Camera event. |\n\n## Sprites & objects\n\n| Function | What it does |\n|---|---|\n| `getMidpointX(variable:String)` | Hitbox center X. |\n| `getMidpointY(variable:String)` | Hitbox center Y. |\n| `getGraphicMidpointX(variable:String)` | Graphic center X. |\n| `getGraphicMidpointY(variable:String)` | Graphic center Y. |\n| `getScreenPositionX(variable:String, ?camera:String = 'game')` | On-screen X. |\n| `getScreenPositionY(variable:String, ?camera:String = 'game')` | On-screen Y. |\n| `setScrollFactor(obj:String, scrollX:Float, scrollY:Float)` | Parallax of an object. |\n| `addLuaSprite(tag:String, ?inFront:Bool = false)` | Adds a sprite to the scene. |\n| `setGraphicSize(obj:String, x:Float, y:Float = 0, updateHitbox:Bool = true)` | Resizes a sprite in pixels. |\n| `scaleObject(obj:String, x:Float, y:Float, updateHitbox:Bool = true)` | Scales a sprite. |\n| `updateHitbox(obj:String)` | Updates the hitbox after scaling. |\n| `getHoldCoverProperty(cover:Dynamic, variable:String)` | Reads a hold cover property. |\n| `setHoldCoverProperty(cover:Dynamic, variable:String, value:Dynamic)` | Changes a hold cover property. |\n| `updateHoldCoverHitbox(cover:Dynamic)` | Updates a hold cover hitbox. |\n| `removeLuaSprite(tag:String, destroy:Bool = true, ?group:String = null)` | **CHANGED**<br>Removes a sprite from the scene. Now also removes backdrops and particles. |\n| `setObjectCamera(obj:String, camera:String = 'game')` | Moves an object to another camera. |\n| `setBlendMode(obj:String, blend:String = '')` | **CHANGED**<br>Blend mode of an object: add, alpha, color, colorburn, colordodge, darken, difference, erase, exclusion, hardlight, hue, invert, layer, lighten, luminosity, multiply, overlay, saturation, screen, shader, softlight, subtract. Empty = normal. color, colorburn, colordodge, exclusion, hue, luminosity, saturation and softlight are new (same as V-Slice). The same names work for the blend option of setGhostTrail and createParticles, and for objects in stage .json files. |\n| `screenCenter(obj:String, pos:String = 'xy')` | Centers an object on screen. |\n| `objectsOverlap(obj1:String, obj2:String)` | Checks if two objects overlap. |\n| `getPixelColor(obj:String, x:Int, y:Int)` | Color of a sprite pixel. |\n| `getObjectOrder(obj:String, ?group:String = null)` | Layer position of an object. |\n| `setObjectOrder(obj:String, position:Int, ?group:String = null)` | Changes the layer position of an object. |\n| `makeLuaSprite(tag:String, ?image:String = null, ?x:Float = 0, ?y:Float = 0)` | **DEPRECATED** - use `createSprite`<br>Creates a sprite. |\n| `makeAnimatedLuaSprite(tag:String, ?image:String = null, ?x:Float = 0, ?y:Float = 0, ?spriteType:String = 'auto')` | **DEPRECATED** - use `cr
