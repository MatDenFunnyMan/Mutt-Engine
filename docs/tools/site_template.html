<title>Mutt Engine Docs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* layout: fixed sidebar with the guide chapters, one chapter at a time on the right; accents borrowed from the four FNF arrow colors */
:root{
  --bg:#f7f6fb; --panel:#ffffff; --fg:#1b1a22; --muted:#625f70; --line:#e2dfeb; --code-bg:#f0eef6;
  --accent:#7b2fd6; --accent-soft:#efe5fd;
  --left:#c24bdb; --down:#00b7d6; --up:#12a64a; --right:#e8344e;
  --display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121118; --panel:#1a1922; --fg:#ece9f4; --muted:#a39fb3; --line:#2c2a38; --code-bg:#211f2b;
  --accent:#b385ff; --accent-soft:#2a2140;
  --left:#d97ae9; --down:#4fd3ea; --up:#4fd17f; --right:#ff6b80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121118; --panel:#1a1922; --fg:#ece9f4; --muted:#a39fb3; --line:#2c2a38; --code-bg:#211f2b;
  --accent:#b385ff; --accent-soft:#2a2140;
  --left:#d97ae9; --down:#4fd3ea; --up:#4fd17f; --right:#ff6b80; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding-block:24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px}
.brand{display:grid;gap:2px;margin-bottom:22px}
.brand b{font-family:var(--display);font-size:22px;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted)}
.arrows{display:flex;gap:4px;margin-bottom:6px}
.arrows i{width:10px;height:10px;border-radius:3px;display:block}
.arrows i:nth-child(1){background:var(--left)}.arrows i:nth-child(2){background:var(--down)}.arrows i:nth-child(3){background:var(--up)}.arrows i:nth-child(4){background:var(--right)}
nav ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;counter-reset:ch}
nav li a{display:grid;grid-template-columns:28px 1fr;align-items:baseline;text-decoration:none;color:var(--fg);padding:7px 10px;border-radius:7px;font-size:15px}
nav li a::before{counter-increment:ch;content:counter(ch,decimal-leading-zero);font-family:var(--mono);font-size:11px;color:var(--muted)}
nav li a:hover{background:var(--code-bg)}
nav li a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .toc{margin:4px 0 8px 38px;display:grid;gap:2px}
nav .toc a{display:block;font-size:13.5px;color:var(--muted);text-decoration:none;padding:2px 0}
nav .toc a:hover{color:var(--fg)}
.menu-btn{display:none}
main{min-width:0;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
article{max-width:780px;margin:0 auto}
article h1{font-family:var(--display);font-size:42px;line-height:1.1;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
article h2{font-family:var(--display);font-size:27px;line-height:1.2;margin:44px 0 10px;padding-top:14px;border-top:1px solid var(--line);text-wrap:balance}
article h3{font-family:var(--display);font-size:20px;margin:28px 0 8px}
article p,article li{max-width:68ch}
article code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);border-radius:5px;padding:1px 5px}
article pre{background:var(--code-bg);border:1px solid var(--line);border-left:3px solid var(--down);border-radius:8px;padding:14px 16px;overflow-x:auto;font-size:14px;line-height:1.5}
article pre code{background:none;padding:0;font-size:inherit}
.table-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
article table{border-collapse:collapse;width:100%;font-size:15px}
article th,article td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
article thead th{border-top:0;font-family:var(--display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--code-bg)}
article blockquote{margin:16px 0;padding:10px 16px;border-left:3px solid var(--up);background:var(--code-bg);border-radius:0 8px 8px 0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{text-decoration:none;display:grid;gap:2px;max-width:48%}
.pager small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.pager .next{text-align:right;margin-left:auto}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .menu-btn{display:inline-block;font:inherit;font-size:14px;background:var(--code-bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
  nav ol[data-open="false"]{display:none}
  article h1{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="shell">
  <nav aria-label="Chapters">
    <div class="brand"><div class="arrows" aria-hidden="true"><i></i><i></i><i></i><i></i></div><b>Mutt Engine</b><span id="version"></span></div>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false">Chapters</button>
    <ol id="chapters" data-open="false"></ol>
  </nav>
  <main><article id="page"></article></main>
</div>
<script id="docs" type="application/json">__DOCS__</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const DOCS = JSON.parse(document.getElementById('docs').textContent);
const list = document.getElementById('chapters');
const page = document.getElementById('page');
document.getElementById('version').textContent = 'Documentation · ' + DOCS.version;

function slugify(text) { return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

function render(md) {
  if (window.marked) return marked.parse(md);
  const pre = document.createElement('pre');
  pre.textContent = md;
  return pre.outerHTML;
}

function show(slug, anchor) {
  const index = Math.max(0, DOCS.pages.findIndex(p => p.slug == slug));
  const doc = DOCS.pages[index];
  page.innerHTML = render(doc.markdown);
  page.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.appendChild(t); });
  page.querySelectorAll('a[href$=".md"], a[href*=".md#"]').forEach(a => {
    const file = a.getAttribute('href').split('#')[0].split('/').pop();
    const target = DOCS.pages.find(p => p.file == file);
    if (target) a.setAttribute('href', '#' + target.slug);
  });
  const toc = [];
  page.querySelectorAll('h2').forEach(h => { h.id = doc.slug + '--' + slugify(h.textContent); toc.push(h); });
  const pager = document.createElement('div');
  pager.className = 'pager';
  const prev = DOCS.pages[index - 1], next = DOCS.pages[index + 1];
  if (prev) pager.insertAdjacentHTML('beforeend', `<a class="prev" href="#${prev.slug}"><small>Previous</small><span></span></a>`);
  if (next) pager.insertAdjacentHTML('beforeend', `<a class="next" href="#${next.slug}"><small>Next</small><span></span></a>`);
  if (prev) pager.querySelector('.prev span').textContent = prev.title;
  if (next) pager.querySelector('.next span').textContent = next.title;
  page.appendChild(pager);

  list.textContent = '';
  DOCS.pages.forEach(p => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + p.slug;
    a.textContent = p.title;
    if (p.slug == doc.slug) a.setAttribute('aria-current', 'page');
    li.appendChild(a);
    if (p.slug == doc.slug && toc.length > 0) {
      const sub = document.createElement('div');
      sub.className = 'toc';
      toc.forEach(h => { const s = document.createElement('a'); s.href = '#' + h.id; s.textContent = h.textContent; sub.appendChild(s); });
      li.appendChild(sub);
    }
    list.appendChild(li);
  });
  document.title = doc.title + ' · Mutt Engine Docs';
  const target = anchor ? document.getElementById(anchor) : null;
  if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
}

function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const sep = hash.indexOf('--');
  show(sep > -1 ? hash.slice(0, sep) : hash, sep > -1 ? hash : null);
}

const menuBtn = document.getElementById('menuBtn');
menuBtn.addEventListener('click', () => {
  const open = list.dataset.open != 'true';
  list.dataset.open = String(open);
  menuBtn.setAttribute('aria-expanded', String(open));
});
window.addEventListener('hashchange', route);
route();
</script>
